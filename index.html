<style>
  :root {
    --travel: #059669;
    --disney: #2563eb;
    --paris:  #e11d48;
    --transition: #9333ea;
    --ink: #334155;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f0f4f8;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  .layout { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- Mobile header ---------- */
  .mobile-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #1e293b; color: #fff; padding: 14px 16px;
  }
  .mobile-bar h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .mobile-bar button {
    background: #334155; color: #fff; border: 0; padding: 8px 14px;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: #1e293b; color: #fff;
    display: flex; flex-direction: column; justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar.collapsed { display: none; }
  .sidebar-head { padding: 24px 24px 8px; }
  .sidebar-head h1 { margin: 0 0 4px; font-size: 22px; }
  .sidebar-head p { margin: 0; color: var(--muted); font-size: 13px; }

  nav { display: flex; flex-direction: column; gap: 4px; padding: 16px; }
  nav button {
    text-align: left; background: transparent; color: #cbd5e1;
    border: 0; border-left: 4px solid transparent;
    padding: 12px; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 14px; line-height: 1.35;
    transition: background .15s, border-color .15s;
  }
  nav button:hover { background: rgba(51,65,85,.5); }
  nav button.active {
    background: #334155; border-left-color: #60a5fa;
    color: #fff; font-weight: 600;
  }
  nav .nav-date { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }

  .sidebar-foot { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .btn-primary {
    width: 100%; padding: 11px 16px; border: 0; border-radius: 8px;
    background: #059669; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-primary:hover { background: #047857; }
  .btn-ghost {
    width: 100%; padding: 8px 16px; border: 0; border-radius: 6px;
    background: #334155; color: #cbd5e1; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { background: rgba(127,29,29,.5); color: #fff; }
  .version { color: #64748b; font-size: 11px; text-align: center; margin-top: 4px; }

  [hidden] { display: none !important; }

  .btn-save {
    width: 100%; padding: 11px 16px; border: 0; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; line-height: 1.3;
  }
  .btn-save:hover { background: #1d4ed8; }
  .btn-save.linked { background: #334155; color: #cbd5e1; font-weight: 500; }
  .btn-save.linked:hover { background: #3f4d63; }
  .save-status { font-size: 11px; text-align: center; color: #94a3b8; line-height: 1.4; }
  .save-status.ok   { color: #34d399; }
  .save-status.warn { color: #fbbf24; }

  .sync-status { font-size: 11px; text-align: center; color: #94a3b8; line-height: 1.4; }
  .sync-status.ok   { color: #34d399; }
  .sync-status.warn { color: #fbbf24; }
  .sync-status.off  { color: #64748b; }

  .conflict {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background: #b45309; color: #fff; padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
    font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .conflict button {
    border: 0; border-radius: 6px; padding: 7px 13px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .conflict .take  { background: #fff; color: #b45309; }
  .conflict .keep  { background: rgba(255,255,255,.2); color: #fff; }

  /* ---------- map / directions chips ---------- */
  .card-body { flex:1; min-width:0; padding:6px 10px 4px; }
  .card .card-body textarea { width:100%; padding:8px 34px 4px 4px; }

  /* ---------- formatted item view ---------- */
  .item-view { padding:9px 30px 4px 4px; cursor:text; border-radius:6px; }
  .item-view:hover { background:#f8fafc; }
  .item-view:focus-visible { outline:2px solid #60a5fa; outline-offset:1px; }
  .item-view p { margin:0 0 6px; font-size:15px; line-height:1.5; color:var(--ink); }
  .item-view p:last-child { margin-bottom:0; }
  .item-view p.placeholder { color:#cbd5e1; font-style:italic; }
  .item-view ol { margin:2px 0 6px; padding-left:20px; }
  .item-view li { margin-bottom:5px; font-size:14.5px; line-height:1.45; color:#475569; }
  .item-view li::marker { color:#94a3b8; font-weight:700; }

  .badge-row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
  .badge {
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; white-space:nowrap;
  }
  .badge.go   { background:#e0e7ff; color:#3730a3; }
  .badge.food { background:#fef3c7; color:#92400e; }
  .badge.note { background:#f1f5f9; color:#475569; }
  .dur { font-size:11.5px; color:#94a3b8; }

  .time-pill {
    display:inline-block; font-weight:700; font-size:13px; color:#0f172a;
    background:#e2e8f0; border-radius:5px; padding:2px 7px; margin-right:8px;
    font-variant-numeric:tabular-nums;
  }
  .chips { display:flex; flex-wrap:wrap; gap:7px; padding:2px 4px 8px; }
  .chip {
    display:inline-flex; align-items:center; gap:5px; text-decoration:none;
    background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;
    border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600;
    max-width:100%; overflow:hidden;
  }
  .chip:hover { background:#dbeafe; }
  .chip.dir { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .chip.dir:hover { background:#d1fae5; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- weather ---------- */
  .day-head.has-wx { border-radius:16px 16px 0 0; margin-bottom:0; }
  .wx {
    border-radius:0 0 16px 16px; margin-bottom:20px;
    background:rgba(15,23,42,.85); color:#fff;
    padding:12px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px;
    font-size:14px;
  }
  .wx .icon { font-size:20px; line-height:1; }
  .wx .temp { font-weight:600; font-size:16px; }
  .wx .sub  { color:#cbd5e1; font-size:12.5px; }
  .wx .asof { margin-left:auto; color:#94a3b8; font-size:11px; }
  .wx .asof.stale { color:#fbbf24; }
  .wx.pending { background:rgba(71,85,105,.55); }
  .wx.clickable { cursor:pointer; user-select:none; }
  .wx .chev { color:#cbd5e1; font-size:12px; }
  .wx.open { border-radius:0; }
  .wx-refresh {
    background:rgba(255,255,255,.12); color:#e2e8f0; border:0; border-radius:6px;
    width:27px; height:27px; font-size:14px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .wx-refresh:hover:not(:disabled) { background:rgba(255,255,255,.26); }
  .wx-refresh:disabled { opacity:.45; cursor:default; }

  .wx-hours {
    background:rgba(15,23,42,.92); border-radius:0 0 16px 16px;
    margin-bottom:20px; padding:10px 12px 14px; overflow-x:auto;
  }
  .wx-hours .row { display:flex; gap:6px; min-width:min-content; }
  .hour { flex:0 0 auto; width:64px; text-align:center; padding:8px 4px; border-radius:10px; color:#fff; }
  .hour .hh { font-size:11px; color:#cbd5e1; }
  .hour .ic { font-size:15px; line-height:1.4; opacity:.85; }
  .hour .tt { font-size:17px; font-weight:700; letter-spacing:-.5px; }
  .hour .fl { font-size:10.5px; color:#e2e8f0; }
  .hour .rn { font-size:10px; color:#7dd3fc; min-height:13px; }
  .hour.peak { outline:2px solid rgba(251,191,36,.8); }
  .hour.h0 { background:rgba(56,189,248,.16); }
  .hour.h1 { background:rgba(255,255,255,.06); }
  .hour.h2 { background:rgba(251,191,36,.16); }
  .hour.h3 { background:rgba(249,115,22,.24); }
  .hour.h4 { background:rgba(239,68,68,.30); }
  .hour.h5 { background:rgba(220,38,38,.44); }
  .heat-summary {
    display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
    padding:2px 4px 10px; font-size:13px; color:#fff;
  }
  .heat-summary .peakbit { font-weight:700; color:#fbbf24; }
  .heat-summary .band { color:#cbd5e1; }
  .heat-summary .advice { color:#fca5a5; font-size:12px; }
  .wx-note { font-size:11px; color:#fbbf24; padding:9px 4px 0; line-height:1.5; }
  .wx-legend { font-size:10.5px; color:#64748b; padding:6px 4px 0; }

  /* ---------- Main ---------- */
  main { flex: 1; padding: 16px; }
  .sheet { max-width: 860px; margin: 0 auto; }

  .day-head {
    border-radius: 16px; padding: 24px; color: #fff; margin-bottom: 20px;
  }
  .day-head h2 { margin: 0 0 6px; font-size: 28px; line-height: 1.15; }
  .day-head p  { margin: 0; font-size: 17px; opacity: .9; }

  .theme-travel     { background: var(--travel); }
  .theme-disney     { background: var(--disney); }
  .theme-paris      { background: var(--paris); }
  .theme-transition { background: var(--transition); }

  .card {
    display: flex; align-items: stretch; position: relative;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 14px; overflow: hidden;
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(15,23,42,.08); }
  .stripe { width: 10px; flex-shrink: 0; }

  .card textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    font-family: inherit; font-size: 15px; line-height: 1.5; color: var(--ink);
    padding: 14px 44px 14px 14px; overflow: hidden;
  }
  .card textarea:focus { box-shadow: inset 0 0 0 2px #60a5fa; border-radius: 8px; }

  .remove {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: #cbd5e1; font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  .remove:hover { background: #fef2f2; color: #dc2626; }

  .add {
    width: 100%; padding: 16px; border: 2px dashed #cbd5e1; border-radius: 12px;
    background: transparent; color: #64748b; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .add:hover { background: #fff; border-color: #94a3b8; color: var(--ink); }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 28px 0 8px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 380px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 19px; color: #0f172a; }
  .modal p  { margin: 0 0 22px; color: #475569; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .modal-actions button { padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; }
  .btn-cancel  { background: transparent; color: #475569; }
  .btn-cancel:hover { background: #f1f5f9; }
  .btn-danger  { background: #dc2626; color: #fff; font-weight: 600; }
  .btn-danger:hover { background: #b91c1c; }

  /* ---------- Desktop ---------- */
  @media (min-width: 768px) {
    .layout { flex-direction: row; }
    .mobile-bar { display: none; }
    .sidebar { width: 288px; }
    .sidebar.collapsed { display: flex; }
    main { padding: 32px; }
    .day-head { padding: 32px; }
    .day-head h2 { font-size: 36px; }
    .remove { opacity: 0; transition: opacity .15s; }
    .card:hover .remove, .remove:focus { opacity: 1; }
  }

  /* ---------- Print / Save as PDF: every day, no chrome ---------- */
  #print-view { display: none; }
  @media print {
    .layout { display: none !important; }
    #print-view { display: block !important; }
    body { background: #fff; }
    .p-day { page-break-inside: avoid; margin-bottom: 26px; }
    .p-day h2 { font-size: 17pt; margin: 0 0 2px; }
    .p-day .p-date { color: #555; font-size: 10pt; margin: 0 0 10px; }
    .p-day li { font-size: 10.5pt; line-height: 1.45; margin-bottom: 7px; white-space: pre-wrap; }
  }
</style>
</head>

<body>
<div class="layout" id="app">
  <div class="mobile-bar">
    <h1>My Trip Itinerary</h1>
    <button id="menu-toggle">Select Day</button>
  </div>

  <aside class="sidebar collapsed" id="sidebar">
    <div>
      <div class="sidebar-head">
        <h1>Trip Itinerary</h1>
        <p>Disneyland &amp; Paris 2026</p>
      </div>
      <nav id="day-nav"></nav>
    </div>
    <div class="sidebar-foot">
      <div class="sync-status" id="sync-status"></div>
      <button class="btn-save" id="link-file" hidden>🔗 Turn on auto-save</button>
      <div class="save-status" id="save-status"></div>
      <button class="btn-primary" id="download">📥 Download a Copy to Send</button>
      <button class="btn-ghost" id="reset">Reset to Original Plan</button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <main><div class="sheet" id="sheet"></div></main>
</div>

<div id="print-view"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache just unavailable */ });
  });
}
</script>


<script>
(function () {
  'use strict';

  /* ==================================================================
     SHARED SYNC — paste your Firebase Realtime Database URL below.
     Leave dbUrl empty and everything still works exactly as before,
     just without sharing between phones.

       dbUrl : from the Firebase console, e.g.
               https://my-trip-default-rtdb.europe-west1.firebasedatabase.app
       path  : the keyword your itinerary is stored under. Anyone who
               knows the URL + path can read and edit it, so keep the
               random word below rather than changing it to "trip".
     ================================================================== */
  var SYNC = {
    dbUrl: 'https://disneyparisplan-default-rtdb.europe-west1.firebasedatabase.app',
    path : 'trip-mw-8q4r7t'      // SANDBOX — separate from the live itinerary
  };

  var STORE   = 'disneyParisItinerary';
  var dataTag = document.getElementById('trip-data');
  var embedded = JSON.parse(dataTag.textContent);

  // Pristine empty shell, grabbed before anything is rendered into it.
  // The downloaded copy gets this back, so it can rebuild itself on open.
  var SKELETON = document.getElementById('app').innerHTML;

  // ---- Load: a file with a new stamp always wins over stale local edits ----
  var days, currentStamp;
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.stamp === embedded.stamp) {
      days = saved.days; currentStamp = saved.stamp;
    } else {
      days = embedded.days; currentStamp = embedded.stamp;
    }
  } catch (e) {
    days = embedded.days; currentStamp = embedded.stamp;
  }

  // Firebase strips empty arrays and nulls, so a day whose items were all
  // deleted comes back with no `activities` key at all — and arrays can
  // return as index-keyed objects. Everything from outside goes through here.
  function toArray(v) {
    if (Array.isArray(v)) return v.filter(function (x) { return x != null; });
    if (v && typeof v === 'object') {
      return Object.keys(v)
        .sort(function (a, b) { return a - b; })
        .map(function (k) { return v[k]; })
        .filter(function (x) { return x != null; });
    }
    return [];
  }
  function normalizeDays(raw) {
    return toArray(raw).map(function (d) {
      d.activities = toArray(d.activities).map(function (a) {
        return {
          id  : (a && a.id) || ('x-' + Math.random().toString(36).slice(2, 9)),
          text: (a && typeof a.text === 'string') ? a.text : ''
        };
      });
      return d;
    });
  }

  days = normalizeDays(days);

  var activeId = days.length ? days[0].id : null;
  var menuOpen = false;

  /* ============ map links ============
     Markers live inside the item text, so the sync normaliser (which rebuilds
     every item as {id, text}) carries them through without any schema change. */
  var RE_MARK = /\[(map|dir):([^\]]+)\]/g;

  function markers(text) {
    var out = [], m;
    RE_MARK.lastIndex = 0;
    while ((m = RE_MARK.exec(text)) !== null) {
      if (m[1] === 'map') {
        out.push({ kind:'map', label:m[2].split(',')[0].trim(),
          url:'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(m[2].trim()) });
      } else {
        var bits = m[2].split('|');
        if (bits.length === 2) {
          out.push({ kind:'dir', label:bits[1].split(',')[0].trim(),
            url:'https://www.google.com/maps/dir/?api=1&travelmode=transit' +
                '&origin=' + encodeURIComponent(bits[0].trim()) +
                '&destination=' + encodeURIComponent(bits[1].trim()) });
        }
      }
    }
    return out;
  }
  function clean(text) {
    return text.replace(RE_MARK, '').replace(/[ \t]+/g, ' ').replace(/ *\n/g, '\n').trim();
  }

  /* ============ presentation ============
     Everything below is DERIVED from the text you already write — no new
     syntax to learn, no extra fields, nothing for the sync layer to carry. */
  var RE_TIME  = /^\s*(\d{1,2}[:.]\d{2}\s*(?:AM|PM)?)\s*[-–—]\s*/i;
  var RE_BADGE = /^\s*(\p{Extended_Pictographic}[^:\n]{0,48}?)\s*:\s*/u;
  var RE_DUR   = /\((~?\s*\d+(?:\s*[-–]\s*\d+)?\s*min(?:ute)?s?[^)]{0,12})\)/i;
  var RE_LI    = /^\s*(\d+)[.)]\s+/;

  function parseItem(raw) {
    var out = { time:null, badge:null, dur:null, blocks:[] };
    var body = clean(raw);

    var m = body.match(RE_TIME);
    if (m) { out.time = m[1].replace(/\s+/g, ' ').toUpperCase(); body = body.slice(m[0].length); }

    m = body.match(RE_BADGE);
    if (m) { out.badge = m[1].trim(); body = body.slice(m[0].length); }

    m = body.match(RE_DUR);
    if (m) { out.dur = m[1].trim().replace(/\s+/g, ' '); body = body.replace(m[0], '').replace(/\s{2,}/g, ' '); }

    // group consecutive "1. …" lines into a single list block
    body.split('\n').forEach(function (line) {
      if (!line.trim()) return;
      var li = line.match(RE_LI);
      var last = out.blocks[out.blocks.length - 1];
      if (li) {
        if (last && last.type === 'list') last.items.push(line.slice(li[0].length).trim());
        else out.blocks.push({ type:'list', items:[line.slice(li[0].length).trim()] });
      } else {
        out.blocks.push({ type:'p', text:line.trim() });
      }
    });
    return out;
  }

  function badgeKind(label) {
    var s = label.toUpperCase();
    if (/TRANSPORT|WALK|METRO|TRAIN|TAXI/.test(s)) return 'go';
    if (/LUNCH|BREAKFAST|DINNER|PICKUP|SNACK|FOOD/.test(s)) return 'food';
    return 'note';
  }

  function renderItemView(el, raw) {
    el.innerHTML = '';
    var p = parseItem(raw);

    if (p.badge) {
      var row = document.createElement('div');
      row.className = 'badge-row';
      var b = document.createElement('span');
      b.className = 'badge ' + badgeKind(p.badge);
      b.textContent = p.badge;
      row.appendChild(b);
      if (p.dur) {
        var d = document.createElement('span');
        d.className = 'dur';
        d.textContent = p.dur;
        row.appendChild(d);
      }
      el.appendChild(row);
    }

    p.blocks.forEach(function (blk, i) {
      if (blk.type === 'list') {
        var ol = document.createElement('ol');
        blk.items.forEach(function (t) {
          var li = document.createElement('li');
          li.textContent = t;
          ol.appendChild(li);
        });
        el.appendChild(ol);
      } else {
        var para = document.createElement('p');
        if (i === 0 && p.time) {
          var pill = document.createElement('span');
          pill.className = 'time-pill';
          pill.textContent = p.time;
          para.appendChild(pill);
        }
        para.appendChild(document.createTextNode(blk.text));
        el.appendChild(para);
      }
    });

    // a time with no body text still deserves its pill
    if (p.time && !p.blocks.length) {
      var only = document.createElement('p');
      var pill2 = document.createElement('span');
      pill2.className = 'time-pill';
      pill2.textContent = p.time;
      only.appendChild(pill2);
      el.appendChild(only);
    }
    if (!p.blocks.length && !p.time && !p.badge) {
      var ph = document.createElement('p');
      ph.className = 'placeholder';
      ph.textContent = 'Empty — tap to add details';
      el.appendChild(ph);
    }
  }

  /* ============ weather ============
     Kept entirely outside `days`, so it never reaches Firebase or a downloaded copy. */
  var TRIP_DAYS = {
    1: { iso:'2026-08-19', where:'disney' },
    2: { iso:'2026-08-20', where:'disney' },
    3: { iso:'2026-08-21', where:'disney' },
    4: { iso:'2026-08-22', where:'paris'  },
    5: { iso:'2026-08-23', where:'paris'  },
    6: { iso:'2026-08-24', where:'paris'  }
  };
  var SPOTS = {
    disney: { lat:48.8722, lon:2.7758, label:'Disneyland Paris' },
    paris : { lat:48.8566, lon:2.3522, label:'Paris' }
  };
  var WX_STORE = 'disneyParisWeather';   // separate key from the itinerary
  var weather = {}, hourly = {}, fetchedAt = null;
  var wxOpen = false, wxBusy = false, wxError = false;

  function wxIcon(c) {
    if (c === 0) return ['☀️','Clear'];
    if (c === 1) return ['🌤️','Mostly clear'];
    if (c === 2) return ['⛅','Partly cloudy'];
    if (c === 3) return ['☁️','Overcast'];
    if (c === 45 || c === 48) return ['🌫️','Fog'];
    if (c >= 51 && c <= 57) return ['🌦️','Drizzle'];
    if (c >= 61 && c <= 67) return ['🌧️','Rain'];
    if (c >= 71 && c <= 77) return ['🌨️','Snow'];
    if (c >= 80 && c <= 82) return ['🌦️','Showers'];
    if (c >= 95) return ['⛈️','Thunderstorms'];
    return ['🌥️','Mixed'];
  }
  function loadWxCache() {
    try {
      var c = JSON.parse(localStorage.getItem(WX_STORE) || 'null');
      if (c && c.weather) { weather = c.weather; hourly = c.hourly || {}; fetchedAt = c.at; }
    } catch (e) {}
  }
  function tripRange() {
    var all = Object.keys(TRIP_DAYS).map(function (k) { return TRIP_DAYS[k].iso; }).sort();
    return [all[0], all[all.length - 1]];
  }
  function getWeather(manual) {
    if (wxBusy) return Promise.resolve();
    wxBusy = true; wxError = false;
    if (manual) renderDay();

    var r = tripRange(), fresh = {};
    var jobs = Object.keys(SPOTS).map(function (key) {
      var s = SPOTS[key];
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + s.lat + '&longitude=' + s.lon +
                '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
                '&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code' +
                '&timezone=Europe%2FParis&start_date=' + r[0] + '&end_date=' + r[1];
      return fetch(url).then(function (res) { return res.json(); }).then(function (j) {
        if (j.daily) {
          j.daily.time.forEach(function (t, i) {
            weather[key + '|' + t] = {
              code: j.daily.weather_code[i],
              max : Math.round(j.daily.temperature_2m_max[i]),
              min : Math.round(j.daily.temperature_2m_min[i]),
              rain: j.daily.precipitation_probability_max[i]
            };
          });
        }
        if (j.hourly) {
          j.hourly.time.forEach(function (t, i) {
            var d = t.slice(0, 10), hh = +t.slice(11, 13);
            if (hh < 7 || hh > 19) return;
            var k = key + '|' + d;
            (fresh[k] = fresh[k] || []).push({
              hh: t.slice(11, 16),
              temp: Math.round(j.hourly.temperature_2m[i]),
              feels: Math.round(j.hourly.apparent_temperature[i]),
              rain: j.hourly.precipitation_probability[i],
              code: j.hourly.weather_code[i]
            });
          });
        }
      });
    });

    return Promise.all(jobs).then(function () {
      if (Object.keys(fresh).length) hourly = fresh;
      fetchedAt = new Date().toISOString();
      try { localStorage.setItem(WX_STORE, JSON.stringify({ at:fetchedAt, weather:weather, hourly:hourly })); } catch (e) {}
    }).catch(function () {
      wxError = true;
    }).then(function () {
      wxBusy = false;
      renderDay();
    });
  }
  function daysOut(iso) {
    var t = new Date(); t.setHours(0,0,0,0);
    return Math.round((new Date(iso + 'T00:00:00') - t) / 86400000);
  }
  function asOfText() {
    if (wxBusy)  return 'refreshing…';
    if (wxError) return "couldn't refresh — showing last saved";
    if (!fetchedAt) return 'forecast';
    var mins = Math.round((Date.now() - new Date(fetchedAt).getTime()) / 60000);
    if (mins < 1)  return 'updated just now';
    if (mins < 60) return 'updated ' + mins + ' min ago';
    if (mins < 1440) return 'updated ' + Math.round(mins / 60) + 'h ago';
    return 'updated ' + new Date(fetchedAt).toLocaleDateString([], { weekday:'short' });
  }
  function wxStale() {
    if (wxError) return true;
    if (!fetchedAt) return false;
    return (Date.now() - new Date(fetchedAt).getTime()) > 6 * 3600 * 1000;
  }

  function persistLocal() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ stamp: currentStamp, days: days }));
    } catch (e) { /* private browsing — edits still work for this session */ }
  }

  // Every edit lands here: browser storage always, plus the file and the
  // shared copy when those are switched on.
  function save() {
    persistLocal();
    scheduleFileSave();
    schedulePush();
  }

  function activeDay() {
    for (var i = 0; i < days.length; i++) if (days[i].id === activeId) return days[i];
    return null;
  }

  function grow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, 24) + 'px';
  }

  // ---- Sidebar ----
  function renderNav() {
    var nav = document.getElementById('day-nav');
    nav.innerHTML = '';
    days.forEach(function (day) {
      var b = document.createElement('button');
      if (day.id === activeId) b.className = 'active';
      var d = document.createElement('span');
      d.className = 'nav-date';
      d.textContent = day.date;
      var t = document.createElement('span');
      t.textContent = day.title;
      b.appendChild(d);
      b.appendChild(t);
      b.addEventListener('click', function () {
        activeId = day.id;
        menuOpen = false;
        syncMenu();
        renderNav();
        renderDay();
        window.scrollTo(0, 0);
      });
      nav.appendChild(b);
    });
  }

  // ---- Day pane ----
  function renderWeather(sheet, meta) {
    var w   = weather[meta.where + '|' + meta.iso];
    var hrs = (hourly[meta.where + '|' + meta.iso] || [])
                .filter(function (h) { return +h.hh.slice(0,2) <= 19; });

    var wx = document.createElement('div');
    if (w) {
      var ic = wxIcon(w.code);
      wx.className = 'wx' + (hrs.length ? ' clickable' : '') + (wxOpen && hrs.length ? ' open' : '');
      wx.innerHTML =
        '<span class="icon">' + ic[0] + '</span>' +
        '<span class="temp">' + w.max + '° / ' + w.min + '°</span>' +
        '<span class="sub">' + ic[1] + ' · ' + w.rain + '% chance of rain · ' + SPOTS[meta.where].label + '</span>' +
        (hrs.length ? '<span class="chev">' + (wxOpen ? '▴ hide hours' : '▾ hour by hour') + '</span>' : '') +
        '<span class="asof' + (wxStale() ? ' stale' : '') + '">' + asOfText() + '</span>';
      if (hrs.length) wx.addEventListener('click', function () { wxOpen = !wxOpen; renderDay(); });
    } else {
      wx.className = 'wx pending';
      wx.innerHTML =
        '<span class="icon">📡</span>' +
        '<span class="sub">No forecast for this date yet — forecasts reach about 14 days ahead.</span>' +
        '<span class="asof' + (wxStale() ? ' stale' : '') + '">' + asOfText() + '</span>';
    }

    var refresh = document.createElement('button');
    refresh.className = 'wx-refresh';
    refresh.title = 'Refresh forecast';
    refresh.setAttribute('aria-label', 'Refresh forecast');
    refresh.textContent = wxBusy ? '⋯' : '↻';
    refresh.disabled = wxBusy;
    refresh.addEventListener('click', function (e) {
      e.stopPropagation();            // must not toggle the hours panel
      getWeather(true);
    });
    wx.appendChild(refresh);
    sheet.appendChild(wx);

    if (!(w && wxOpen && hrs.length)) return;

    var peak = hrs.reduce(function (a, b) { return b.feels > a.feels ? b : a; }, hrs[0]);
    var hot  = hrs.filter(function (h) { return h.feels >= 28; });
    var panel = document.createElement('div');
    panel.className = 'wx-hours';

    var sum = document.createElement('div');
    sum.className = 'heat-summary';
    var parts = '<span class="peakbit">Peak feels like ' + peak.feels + '° at ' + peak.hh + '</span>';
    parts += hot.length
      ? '<span class="band">28°+ from ' + hot[0].hh + ' to ' + hot[hot.length - 1].hh + '</span>'
      : '<span class="band">stays below 28° all day</span>';
    if (peak.feels >= 30) {
      parts += '<span class="advice">🥵 water, hats and a shaded break in the middle of the day</span>';
    }
    sum.innerHTML = parts;
    panel.appendChild(sum);

    var row = document.createElement('div');
    row.className = 'row';
    hrs.forEach(function (h) {
      var band = h.feels <= 20 ? 'h0' : h.feels <= 24 ? 'h1' : h.feels <= 27 ? 'h2'
               : h.feels <= 30 ? 'h3' : h.feels <= 33 ? 'h4' : 'h5';
      var cell = document.createElement('div');
      cell.className = 'hour ' + band + (h === peak ? ' peak' : '');
      cell.innerHTML =
        '<div class="hh">' + h.hh + '</div>' +
        '<div class="ic">' + wxIcon(h.code)[0] + '</div>' +
        '<div class="tt">' + h.feels + '°</div>' +
        '<div class="fl">actual ' + h.temp + '°</div>' +
        '<div class="rn">' + (h.rain >= 25 ? '☔ ' + h.rain + '%' : '') + '</div>';
      row.appendChild(cell);
    });
    panel.appendChild(row);

    var out = daysOut(meta.iso);
    if (out > 7) {
      var note = document.createElement('div');
      note.className = 'wx-note';
      note.textContent = '⚠ ' + out + ' days ahead — the daily trend is meaningful at this range, but treat the hour-by-hour numbers as indicative. They firm up from about 5 days out.';
      panel.appendChild(note);
    }
    var leg = document.createElement('div');
    leg.className = 'wx-legend';
    leg.textContent = '07:00–19:00 · big number is feels-like, warmer background means hotter · rain only shown above 25%.';
    panel.appendChild(leg);

    sheet.appendChild(panel);
  }

  function renderDay() {
    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    var day = activeDay();
    if (!day) return;

    var meta = TRIP_DAYS[day.id];

    var head = document.createElement('div');
    head.className = 'day-head theme-' + day.theme + (meta ? ' has-wx' : '');
    var h2 = document.createElement('h2'); h2.textContent = day.title;
    var p  = document.createElement('p');  p.textContent  = day.date;
    head.appendChild(h2); head.appendChild(p);
    sheet.appendChild(head);

    if (meta) renderWeather(sheet, meta);

    day.activities.forEach(function (act) {
      var card = document.createElement('div');
      card.className = 'card';

      var stripe = document.createElement('div');
      stripe.className = 'stripe theme-' + day.theme;

      var body = document.createElement('div');
      body.className = 'card-body';

      // Formatted, read-only presentation. Being a <div> it cannot receive
      // typing or autocorrect at all, so the tidy view can never be written
      // back over the real text — the risk is removed rather than guarded.
      var view = document.createElement('div');
      view.className = 'item-view';
      view.tabIndex = 0;
      view.setAttribute('role', 'button');
      view.setAttribute('aria-label', 'Edit this item');

      var ta = document.createElement('textarea');
      ta.className = 'item-edit';
      ta.rows = 1;
      ta.hidden = true;
      ta.placeholder = 'Enter activity details...';

      var chips = document.createElement('div');
      chips.className = 'chips';
      function paintChips() {
        chips.innerHTML = '';
        markers(act.text).forEach(function (mk) {
          var a = document.createElement('a');
          a.className = 'chip' + (mk.kind === 'dir' ? ' dir' : '');
          a.href = mk.url; a.target = '_blank'; a.rel = 'noopener';
          a.appendChild(document.createTextNode(mk.kind === 'dir' ? '🚇 ' : '📍 '));
          var s = document.createElement('span');
          s.textContent = (mk.kind === 'dir' ? 'Directions to ' : '') + mk.label;
          a.appendChild(s);
          chips.appendChild(a);
        });
      }
      function paintView() { renderItemView(view, act.text); paintChips(); }
      paintView();

      function startEdit() {
        view.hidden = true;
        ta.hidden = false;
        ta.value = act.text;          // always the real text, markers included
        grow(ta);
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
      function endEdit() {
        ta.hidden = true;
        view.hidden = false;
        paintView();
      }
      view.addEventListener('click', startEdit);
      view.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startEdit(); }
      });
      ta.addEventListener('blur', endEdit);
      ta.addEventListener('input', function () {
        if (ta.hidden) return;        // cheap insurance; a hidden box can't fire this
        act.text = ta.value;
        grow(ta);
        save();
      });

      var rm = document.createElement('button');
      rm.className = 'remove';
      rm.title = 'Remove item';
      rm.setAttribute('aria-label', 'Remove item');
      rm.textContent = '✕';
      rm.addEventListener('click', function () {
        day.activities = day.activities.filter(function (a) { return a !== act; });
        save();
        renderDay();
      });

      body.appendChild(view);
      body.appendChild(ta);
      body.appendChild(chips);
      card.appendChild(stripe);
      card.appendChild(body);
      card.appendChild(rm);
      sheet.appendChild(card);
      grow(ta);
    });

    var add = document.createElement('button');
    add.className = 'add';
    add.textContent = '+ Add New Itinerary Item';
    add.addEventListener('click', function () {
      day.activities.push({ id: 'x-' + Date.now().toString(36), text: '' });
      save();
      renderDay();
      var views = sheet.querySelectorAll('.item-view');
      if (views.length) views[views.length - 1].click();   // open the new item for editing
    });
    sheet.appendChild(add);

    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Edits save to this browser automatically. Use Download to save a copy that carries your changes to other people.';
    sheet.appendChild(hint);
  }

  // ---- Rebuild this whole page as text, with current data baked in ----
  function serialize(stamp) {
    var clone = document.documentElement.cloneNode(true);

    var payload = JSON.stringify({ stamp: stamp, days: days }, null, 2)
                    .replace(/</g, '\\u003c');   // stop a closing script tag ending the block
    clone.querySelector('#trip-data').textContent = '\n' + payload + '\n';

    // Swap the rendered markup back for the empty shell; the script
    // repopulates it on open. (Blanking it entirely would delete the
    // sidebar and #sheet that the script writes into.)
    clone.querySelector('#app').innerHTML = SKELETON;
    clone.querySelector('#print-view').innerHTML = '';

    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  // ---- Download: a copy to hand to somebody else ----
  function download() {
    var html = serialize(new Date().toISOString());
    var url  = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    var a    = document.createElement('a');
    a.href = url;
    a.download = 'disney-paris-itinerary.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ================== Auto-save straight into the file ==================
  // Desktop Chrome/Edge only. Phones have no API for writing to a file,
  // so there we silently stay on the Download-a-copy workflow.
  var CAN_WRITE = (typeof window.showSaveFilePicker === 'function');
  var fileHandle = null;      // live, permission granted
  var pendingHandle = null;   // remembered, needs a click to re-grant
  var saveTimer = null;

  function idbOpen() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('itinerary-file', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('h'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror   = function () { rej(r.error); };
    });
  }
  function idbPut(v) {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('h', 'readwrite');
        tx.objectStore('h').put(v, 'file');
        tx.oncomplete = function () { res(); };
        tx.onerror    = function () { rej(tx.error); };
      });
    });
  }
  function idbGet() {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('h', 'readonly');
        var q = tx.objectStore('h').get('file');
        q.onsuccess = function () { res(q.result || null); };
        q.onerror   = function () { rej(q.error); };
      });
    });
  }

  function status(msg, cls) {
    var el = document.getElementById('save-status');
    el.textContent = msg;
    el.className = 'save-status' + (cls ? ' ' + cls : '');
  }
  function setLinked(on) {
    var b = document.getElementById('link-file');
    if (on) { b.classList.add('linked'); b.textContent = '💾 Save now'; }
    else    { b.classList.remove('linked'); b.textContent = '🔗 Turn on auto-save'; }
  }
  function clockNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function writeFile() {
    if (!fileHandle) return Promise.resolve();
    var stamp = new Date().toISOString();
    var html  = serialize(stamp);
    return fileHandle.createWritable()
      .then(function (w) { return w.write(html).then(function () { return w.close(); }); })
      .then(function () {
        currentStamp = stamp;     // keep browser copy in step with the file
        persistLocal();
        status('Saved to file at ' + clockNow(), 'ok');
      })
      .catch(function (e) {
        status('Could not write the file (' + (e && e.name) + '). Your edits are still safe in this browser — use Download.', 'warn');
      });
  }

  function scheduleFileSave() {
    if (!fileHandle) return;
    status('Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 900);
  }

  function linkFile() {
    if (fileHandle) { clearTimeout(saveTimer); writeFile(); return; }

    if (pendingHandle) {                       // known file, just needs permission again
      pendingHandle.requestPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') {
          fileHandle = pendingHandle; pendingHandle = null;
          setLinked(true); writeFile();
        } else {
          status('Permission refused — still saving in this browser only.', 'warn');
        }
      });
      return;
    }

    window.showSaveFilePicker({
      suggestedName: 'disney-paris-itinerary.html',
      types: [{ description: 'Web page', accept: { 'text/html': ['.html'] } }]
    }).then(function (h) {
      fileHandle = h;
      setLinked(true);
      return idbPut(h).catch(function () { /* handle just won't survive a reload */ })
                      .then(writeFile);
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;          // user closed the dialog
      status('Could not link the file (' + (e && e.name) + ').', 'warn');
    });
  }

  // ================= Shared copy in the cloud (Firebase REST) =================
  // Plain fetch against the Realtime Database REST endpoint — no SDK, no CDN,
  // so the file stays self-contained and still opens with no internet at all.
  var SYNC_ON      = !!SYNC.dbUrl;
  var lastSynced   = null;    // stamp of the last version we exchanged with the cloud
  var dirty        = false;   // we hold edits the cloud hasn't seen
  var pushTimer    = null;
  var pollTimer    = null;
  var conflictOpen = false;

  function endpoint() {
    return SYNC.dbUrl.replace(/\/+$/, '') + '/' + SYNC.path + '.json';
  }
  function syncStatus(msg, cls) {
    var el = document.getElementById('sync-status');
    el.textContent = msg;
    el.className = 'sync-status' + (cls ? ' ' + cls : '');
  }

  function pushRemote() {
    if (!SYNC_ON || conflictOpen) return Promise.resolve();
    var stamp = new Date().toISOString();
    syncStatus('Sharing…');
    return fetch(endpoint(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stamp: stamp, days: days })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      currentStamp = stamp;
      lastSynced   = stamp;
      dirty        = false;
      persistLocal();
      syncStatus('Shared · updated ' + clockNow(), 'ok');
    }).catch(function () {
      dirty = true;
      syncStatus(navigator.onLine
        ? 'Can’t reach the shared copy — will retry.'
        : 'Offline — your edits are safe and will share when you’re back online.', 'warn');
    });
  }

  function schedulePush() {
    if (!SYNC_ON) return;
    dirty = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 1200);
  }

  function adopt(remote) {
    days = remote.days;
    currentStamp = remote.stamp;
    lastSynced   = remote.stamp;
    dirty        = false;
    if (!days.some(function (d) { return d.id === activeId; })) {
      activeId = days.length ? days[0].id : null;
    }
    persistLocal();
    renderNav();
    renderDay();
    syncStatus('Updated with their changes · ' + clockNow(), 'ok');
  }

  function showConflict(remote) {
    if (conflictOpen) return;
    conflictOpen = true;
    var bar = document.createElement('div');
    bar.className = 'conflict';
    bar.innerHTML =
      '<span>They’ve edited the itinerary too. Whose version should win?</span>' +
      '<button class="take">Use their version</button>' +
      '<button class="keep">Keep mine</button>';
    document.body.appendChild(bar);

    function close() { conflictOpen = false; bar.remove(); }
    bar.querySelector('.take').addEventListener('click', function () {
      close(); adopt(remote);
    });
    bar.querySelector('.keep').addEventListener('click', function () {
      close(); lastSynced = remote.stamp; pushRemote();
    });
  }

  function pullRemote() {
    if (!SYNC_ON || conflictOpen) return Promise.resolve();
    return fetch(endpoint(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (raw) {
        if (!raw || !raw.days) {                // nothing up there yet — seed it
          return pushRemote();
        }
        var remote = { stamp: raw.stamp, days: normalizeDays(raw.days) };
        if (!remote.days.length) {              // came back unusable — reseed
          return pushRemote();
        }
        if (remote.stamp === lastSynced) {      // nothing new
          if (!dirty) syncStatus('Shared · in sync', 'ok');
          return;
        }
        if (dirty) showConflict(remote);        // both sides changed — ask
        else       adopt(remote);
      })
      .catch(function () {
        syncStatus(navigator.onLine
          ? 'Can’t reach the shared copy — will retry.'
          : 'Offline — showing your saved copy.', 'warn');
      });
  }

  // Always look for their changes BEFORE sending ours, so a clash is
  // caught and asked about rather than silently overwriting them.
  function syncTick() {
    return pullRemote().then(function () {
      if (dirty && !conflictOpen && navigator.onLine) return pushRemote();
    });
  }

  function initSync() {
    if (!SYNC_ON) {
      syncStatus('Sharing off — add your database URL to switch it on.', 'off');
      return;
    }
    syncTick();
    pollTimer = setInterval(function () {
      if (document.visibilityState === 'visible') syncTick();
    }, 20000);
    window.addEventListener('online', syncTick);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') syncTick();
    });
  }

  function initSaving() {
    if (!CAN_WRITE) {
      status('Auto-save to file needs Chrome or Edge on a computer. Here, edits save in this browser — use Download to keep a copy.');
      return;
    }
    document.getElementById('link-file').hidden = false;
    idbGet().then(function (h) {
      if (!h) { status('Not linked yet — edits save in this browser only.'); return; }
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') {
          fileHandle = h; setLinked(true); status('Auto-saving to your file.', 'ok');
        } else {
          pendingHandle = h;
          document.getElementById('link-file').textContent = '🔗 Reconnect auto-save';
          status('Click to reconnect auto-save to your file.', 'warn');
        }
      });
    }).catch(function () {
      status('Not linked yet — edits save in this browser only.');
    });
  }

  // ---- Reset ----
  function confirmReset() {
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>Reset Itinerary?</h3>' +
      '<p>Are you sure you want to reset all your changes back to the original plan? This cannot be undone.</p>' +
      '<div class="modal-actions">' +
      '<button class="btn-cancel">Cancel</button>' +
      '<button class="btn-danger">Yes, Reset</button>' +
      '</div></div>';
    document.body.appendChild(overlay);

    function close() { document.body.removeChild(overlay); }
    overlay.querySelector('.btn-cancel').addEventListener('click', close);
    overlay.querySelector('.btn-danger').addEventListener('click', function () {
      days = JSON.parse(JSON.stringify(embedded.days));
      activeId = days.length ? days[0].id : null;
      save();
      close();
      renderNav();
      renderDay();
    });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  }

  // ---- Mobile menu ----
  function syncMenu() {
    var sb = document.getElementById('sidebar');
    if (menuOpen) sb.classList.remove('collapsed'); else sb.classList.add('collapsed');
    document.getElementById('menu-toggle').textContent = menuOpen ? 'Close Menu' : 'Select Day';
  }

  // ---- Print: expand every day, since only one is on screen ----
  function buildPrintView() {
    var box = document.getElementById('print-view');
    box.innerHTML = '';
    var title = document.createElement('h1');
    title.textContent = 'Disneyland & Paris 2026';
    box.appendChild(title);

    days.forEach(function (day) {
      var sec = document.createElement('section');
      sec.className = 'p-day';
      var h = document.createElement('h2'); h.textContent = day.title;
      var d = document.createElement('p');  d.className = 'p-date'; d.textContent = day.date;
      var ul = document.createElement('ul');
      day.activities.forEach(function (a) {
        if (!a.text.trim()) return;
        var li = document.createElement('li');
        li.textContent = a.text;
        ul.appendChild(li);
      });
      sec.appendChild(h); sec.appendChild(d); sec.appendChild(ul);
      box.appendChild(sec);
    });
  }

  // ---- Wire up ----
  document.getElementById('download').addEventListener('click', download);
  document.getElementById('reset').addEventListener('click', confirmReset);
  document.getElementById('link-file').addEventListener('click', linkFile);
  document.getElementById('menu-toggle').addEventListener('click', function () {
    menuOpen = !menuOpen;
    syncMenu();
  });
  window.addEventListener('beforeprint', buildPrintView);

  // Don't leave a pending edit unwritten if the tab is hidden or closed.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && fileHandle) {
      clearTimeout(saveTimer);
      writeFile();
    }
  });

  var v = new Date(embedded.stamp);
  document.getElementById('version').textContent =
    isNaN(v) ? '' : 'Version: ' + v.toLocaleDateString() + ' ' +
      v.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  loadWxCache();
  renderNav();
  renderDay();
  syncMenu();
  initSaving();
  initSync();
  getWeather();
})();
</script>
</body>
</html>
